<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d08"/><stop offset="1" stop-color="#140d03"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".52" r=".5"><stop offset=".4" stop-color="#FFB52E" stop-opacity=".6"/><stop offset=".75" stop-color="#FFB52E" stop-opacity=".12"/><stop offset="1" stop-color="#FFB52E" stop-opacity="0"/></radialGradient>
<linearGradient id="body" x1=".1" y1=".1" x2=".9" y2="1" ><stop offset="0" stop-color="#FF9F1C"/><stop offset="0.45" stop-color="#FFD86B"/><stop offset="0.7" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFC46B"/></linearGradient>
<radialGradient id="sheen" cx=".4" cy=".65" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dx="-14" dy="-18" result="o"/>
<feComposite in="SourceAlpha" in2="o" operator="out" result="e"/><feFlood flood-color="#2a1d08" flood-opacity=".5"/><feComposite in2="e" operator="in" result="sh"/>
<feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b2"/><feOffset in="b2" dx="10" dy="12" result="o2"/>
<feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/><feFlood flood-color="#fff" flood-opacity=".75"/><feComposite in2="e2" operator="in" result="li"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="li"/></feMerge></filter>
<filter id="deb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dx="4" dy="7" result="o"/>
<feComposite in="SourceAlpha" in2="o" operator="out" result="e"/><feFlood flood-color="#000" flood-opacity=".7"/><feComposite in2="e" operator="in" result="s"/>
