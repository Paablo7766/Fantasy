<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f1238"/><stop offset="1" stop-color="#0e0820"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".52" r=".5"><stop offset=".4" stop-color="#A26BFF" stop-opacity=".6"/><stop offset=".75" stop-color="#A26BFF" stop-opacity=".12"/><stop offset="1" stop-color="#A26BFF" stop-opacity="0"/></radialGradient>
<linearGradient id="body" x1=".1" y1=".1" x2=".9" y2="1" ><stop offset="0" stop-color="#7B5CFF"/><stop offset="0.45" stop-color="#C9B8FF"/><stop offset="0.7" stop-color="#FBEFFF"/><stop offset="1" stop-color="#FF9AD5"/></linearGradient>
<radialGradient id="sheen" cx=".4" cy=".65" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dx="-14" dy="-18" result="o"/>
<feComposite in="SourceAlpha" in2="o" operator="out" result="e"/><feFlood flood-color="#1f1238" flood-opacity=".5"/><feComposite in2="e" operator="in" result="sh"/>
<feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b2"/><feOffset in="b2" dx="10" dy="12" result="o2"/>
